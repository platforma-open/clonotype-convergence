  # MiXCR is held at 2.19.1 for one reason only, and that reason has expired:
  # 2.21.4+ declares the `requiresColumnsCollection` feature flag, and a
  # runtime rejects any `requires*` flag missing from its allowlist
  # (RuntimeCapabilities.getIncompatibleFlags). `ColumnsCollection` joined the
  # service list in pl-model-common 1.48.0, which is what pl-middle-layer
  # 1.68.0 -- bundled with @platforma-sdk/test 1.83.2 -- uses; test 1.79.x
  # carried ML 1.64.42 on pl-model-common 1.46.3, which lacked it.
  # So this pin can be raised (newest is 2.23.0) once the end-to-end test has
  # been run against it. Note the boundary is 2.21.4, not 2.20.0.
  "@platforma-open/milaboratories.mixcr-clonotyping-2": 2.19.1
